name: MOS Desk hourly quotes
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: mos-quotes
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EU+US quotes
        run: node fetch.mjs
      - name: Commit quotes.json
        run: |
          git config user.name mos-desk-bot
          git config user.email bot@users.noreply.github.com
          git add quotes.json
          git diff --cached --quiet || git commit -m 'quotes update'
          git push